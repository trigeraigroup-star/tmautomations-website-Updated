<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A shorter process story · TMAutomations</title>
<style>
@font-face{font-family:Barlow;src:url('/fonts/barlow-semi-condensed-regular.ttf')}*{box-sizing:border-box}body{margin:0;color:#223d36;background:#f4e6ce url('/images/parchment.jpg') center/780px;font-family:Barlow,sans-serif}a{color:inherit;text-underline-offset:5px}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #386f65;outline-offset:5px}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-size:25px;text-decoration:none;color:#000}.brand span{color:#386f65}nav{display:flex;gap:26px;font-size:18px}nav a{text-decoration:none}main{max-width:1250px;width:90%;margin:0 auto;min-height:calc(100svh - 70px);display:flex;flex-direction:column;justify-content:center;padding:24px 0 35px}h1{font-weight:400;font-size:clamp(36px,4vw,55px);margin:0 0 8px}.subtitle{color:#386f65;font-size:22px;margin:0 0 20px}.theatre{position:relative;height:390px;isolation:isolate}.wash{position:absolute;inset:0 12%;background:url('/images/build-board.jpg') center/cover;opacity:.11;mix-blend-mode:multiply;mask-image:radial-gradient(ellipse,#000,transparent 70%)}.tile{position:absolute;width:16%;max-width:155px;aspect-ratio:1;top:31%;left:var(--x);background:url('/images/paper-objects.jpg');background-size:447.857% 447.857%;background-position:var(--bx) var(--by);mix-blend-mode:multiply;transform:translate(var(--dx),var(--dy)) rotate(var(--r));transition:transform 1.1s cubic-bezier(.16,1,.3,1);z-index:2}.theatre[data-state='1'] .tile,.theatre[data-state='2'] .tile{transform:translate(0,0) rotate(0)}.routes{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.route-base{fill:none;stroke:#386f6525;stroke-width:2}.route{fill:none;stroke:#386f65;stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.4s ease .45s}.theatre[data-state='1'] .route,.theatre[data-state='2'] .route{stroke-dashoffset:0}.point{fill:#386f65;opacity:0}.theatre[data-state='1'] .point{animation:travel 1.8s ease .7s both}.theatre[data-state='2'] .point{opacity:0}@keyframes travel{0%{opacity:1;transform:translateX(0)}90%{opacity:1}100%{opacity:0;transform:translateX(800px)}}.check{stroke:#386f65;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s ease}.theatre[data-state='2'] .check{stroke-dashoffset:0}.flag{position:absolute;left:51%;top:24%;font-size:23px;color:#a34f39;opacity:0;transition:opacity .2s}.theatre[data-state='1'] .flag{animation:flag 1.3s ease .3s both}@keyframes flag{20%,60%{opacity:1}100%{opacity:0}}.stamp{position:absolute;left:43%;bottom:3%;font-size:23px;color:#386f65;opacity:0;transform:translateY(8px);transition:all .5s}.theatre[data-state='2'] .stamp{opacity:1;transform:none}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}.step{border:0;border-top:1px solid #8d8b7280;background:transparent;padding:18px 0;text-align:left;position:relative}.step:before{content:'';height:3px;background:#386f65;position:absolute;left:0;right:0;top:-2px;transform:scaleX(0);transform-origin:left;transition:transform .5s}.step[aria-selected=true]:before{transform:scaleX(1)}.step strong{display:block;font-size:28px;font-weight:400}.step span{display:block;color:#386f65;font-size:18px;margin-top:6px}.step[aria-selected=false]{opacity:.65}.bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:12px;font-size:18px}.replay{border:1px solid #8d8b72;background:transparent;padding:10px 20px;min-height:44px}details{max-width:780px;font-size:20px;color:#386f65;line-height:1.5}summary{cursor:pointer;font-size:18px}details p{margin:12px 0}.note{font-size:15px;color:#566f61;margin-top:14px}@media(max-width:650px){.top{height:100px;flex-direction:column;justify-content:center;gap:13px}nav{font-size:16px;gap:20px}main{min-height:calc(100svh - 100px)}.theatre{height:260px}.tile{width:17%;top:35%}.controls{gap:12px}.step strong{font-size:23px}.step span{font-size:16px}.stamp{left:30%;font-size:20px}.bottom{align-items:flex-start}.subtitle{font-size:20px}.flag{top:23%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tile{transform:none!important}}
</style></head><body>
<header class="top"><a href="/" class="brand"><span>TM</span>Automations</a><nav><a href="/#approach">Approach</a><a href="/#process">Process</a><a href="/#work">Work</a><a href="/#contact">Contact</a></nav></header>
<main><h1>Your business. Better connected.</h1><p class="subtitle">We understand the work, build what helps, and stay alongside your team.</p>
<div class="theatre" data-state="0" role="img" aria-label="Scattered work becomes a connected, tested system that your team can use."><div class="wash"></div>
<svg class="routes" viewBox="0 0 1000 390" preserveAspectRatio="none" aria-hidden="true"><path class="route-base" d="M100 195 H900"/><path class="route" pathLength="1" d="M100 195 H900"/><circle class="point" cx="100" cy="195" r="5"/><g><path class="check" pathLength="1" d="M94 284 l6 6 12 -14"/><path class="check" pathLength="1" style="transition-delay:.12s" d="M294 284 l6 6 12 -14"/><path class="check" pathLength="1" style="transition-delay:.24s" d="M494 284 l6 6 12 -14"/><path class="check" pathLength="1" style="transition-delay:.36s" d="M694 284 l6 6 12 -14"/><path class="check" pathLength="1" style="transition-delay:.48s" d="M894 284 l6 6 12 -14"/></g></svg>
<div class="tile" style="--x:2%;--bx:4.1%;--by:12.32%;--dx:18px;--dy:-38px;--r:-11deg"></div><div class="tile" style="--x:22%;--bx:34.9%;--by:12.32%;--dx:-8px;--dy:47px;--r:8deg"></div><div class="tile" style="--x:42%;--bx:65.7%;--by:12.32%;--dx:13px;--dy:-45px;--r:-7deg"></div><div class="tile" style="--x:62%;--bx:96.5%;--by:12.32%;--dx:10px;--dy:34px;--r:11deg"></div><div class="tile" style="--x:82%;--bx:65.7%;--by:49.28%;--dx:-9px;--dy:-15px;--r:-8deg"></div><span class="flag" aria-hidden="true">!</span><span class="stamp">Ready for your team.</span></div>
<div class="controls" role="tablist" aria-label="The work process"><button class="step" role="tab" aria-selected="true" aria-controls="description" id="step-0"><strong>Understand.</strong><span>Find what matters most.</span></button><button class="step" role="tab" aria-selected="false" aria-controls="description" id="step-1"><strong>Build.</strong><span>Make it work. Test it properly.</span></button><button class="step" role="tab" aria-selected="false" aria-controls="description" id="step-2"><strong>Put it to work.</strong><span>Integrate, support, improve.</span></button></div>
<div class="bottom"><details><summary>What happens at this stage?</summary><div id="description" role="tabpanel" aria-labelledby="step-0"><p></p></div></details><button class="replay" type="button">Replay story</button></div><p class="note">Motion concept preview · <a href="flow.html">Compare the illustrated flow</a></p></main>
<script>
const theatre=document.querySelector('.theatre'),buttons=[...document.querySelectorAll('.step')],description=document.querySelector('#description');
const descriptions=['Discover & Prioritize: We observe and map your work, identify opportunities, and prioritize by expected ROI.','Build & Test: We build the solution, test real scenarios, correct issues, and review it with your team.','Integrate, Support & Improve: We bring it into daily work, support adoption, monitor performance, and keep improving.'];let timers=[];
function stop(){timers.forEach(clearTimeout);timers=[]}function select(i){theatre.dataset.state=i;buttons.forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));b.tabIndex=i===j?0:-1});description.setAttribute('aria-labelledby','step-'+i);description.querySelector('p').textContent=descriptions[i]}
function play(){stop();select(0);if(matchMedia('(prefers-reduced-motion: reduce)').matches){select(2);return}timers.push(setTimeout(()=>select(1),1800),setTimeout(()=>select(2),4700))}
buttons.forEach((b,i)=>{b.addEventListener('click',()=>{stop();select(i)});b.addEventListener('keydown',e=>{let n;if(e.key==='ArrowRight')n=(i+1)%3;else if(e.key==='ArrowLeft')n=(i+2)%3;else return;e.preventDefault();stop();select(n);buttons[n].focus()})});document.querySelector('.replay').addEventListener('click',play);document.querySelector('details').addEventListener('toggle',e=>{if(e.target.open)stop()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});play();
</script></body></html>
